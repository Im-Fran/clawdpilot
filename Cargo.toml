[package]
name = "clawdpilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "TUI en Rust para pilotar varios agentes de terminal (claude, codex, aider...) en paralelo, en una rejilla de PTYs reales"
authors = ["Francisco Solis <https://franciscosolis.cl>"]
license = "GPL-3.0-only"
repository = "https://github.com/Im-Fran/clawdpilot"
homepage = "https://github.com/Im-Fran/clawdpilot"
readme = "README.md"
keywords = ["tui", "terminal", "pty", "claude", "agents"]
categories = ["command-line-utilities", "development-tools"]
# ponytail: se distribuye compilando desde el repo, no por crates.io
publish = false

[dependencies]
anyhow = "1.0.104"
portable-pty = "0.9.0"
ratatui = "0.30.2"
vt100 = "0.16.2"
